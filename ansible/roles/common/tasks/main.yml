- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Configure chrony
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    mode: "0644"
  notify: Restart chrony

- name: Apply sysctl tuning
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-platform.conf
    reload: true
  loop: "{{ common_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Raise open files limit
  ansible.builtin.copy:
    dest: /etc/security/limits.d/90-nofile.conf
    content: |
      *    soft nofile {{ common_nofile_limit }}
      *    hard nofile {{ common_nofile_limit }}
    mode: "0644"

- name: Create admin users
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: sudo
    append: true
    shell: /bin/bash
  loop: "{{ common_admin_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install authorized keys from GitLab
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ item.ssh_keys_url }}"
    exclusive: true
  loop: "{{ common_admin_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Passwordless sudo for admin users
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ item.name }}"
    content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: visudo -cf %s
  loop: "{{ common_admin_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Harden sshd
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config.d/90-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"
  when: common_unattended_upgrades

- name: Ensure fail2ban is running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
