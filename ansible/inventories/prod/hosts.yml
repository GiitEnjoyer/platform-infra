all:
  vars:
    ansible_user: deploy
    ansible_ssh_common_args: "-J deploy@bastion.prod.example.internal"
    env: prod
  children:
    bastion:
      hosts:
        bastion.prod.example.internal:
          ansible_ssh_common_args: ""
    gitlab_runners:
      hosts:
        runner-[01:03].prod.example.internal:
    backup_workers:
      hosts:
        backup-01.prod.example.internal:
    legacy_apps:
      hosts:
        legacy-[01:04].prod.example.internal:
