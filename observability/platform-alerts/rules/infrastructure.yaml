groups:
  - name: nodes
    rules:
      - alert: NodeFilesystemAlmostFull
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) < 0.10
          and on (instance, device, mountpoint) node_filesystem_readonly == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is over 90% full"
          runbook_url: https://github.com/GiitEnjoyer/platform-infra/blob/main/docs/runbooks/disk-full.md

      - alert: NodeFilesystemWillFillIn4h
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 4 * 3600) < 0
          and node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.25
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} will be full within 4 hours"
          runbook_url: https://github.com/GiitEnjoyer/platform-infra/blob/main/docs/runbooks/disk-full.md

      - alert: NodeHighMemoryPressure
        expr: rate(node_vmstat_pgmajfault[5m]) > 1000 and (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Node {{ $labels.instance }} is swapping/thrashing (major faults and <5% memory available)"

      - alert: NodeExporterDown
        expr: up{job=~"node-exporter|node"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "node_exporter on {{ $labels.instance }} is unreachable"

  - name: tls
    rules:
      - alert: CertificateExpiringSoon
        expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < 14 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in less than 14 days; cert-manager renewal is failing"

      - alert: CertificateNotReady
        expr: certmanager_certificate_ready_status{condition="False"} == 1
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} is not Ready"
