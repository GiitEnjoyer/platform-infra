{{- range $path, $_ := .Files.Glob "rules/*.yaml" }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: {{ base $path | trimSuffix ".yaml" }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    {{- with $.Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
{{ $.Files.Get $path | indent 2 }}
{{- end }}
