extends: default
ignore: |
  .terraform/
  .terragrunt-cache/
  kubernetes/platform/charts/*/templates/
  observability/platform-alerts/templates/
rules:
  line-length:
    max: 160
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "yes", "no"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  braces:
    max-spaces-inside: 1
  indentation:
    indent-sequences: consistent
